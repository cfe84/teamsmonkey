name: Build Teamsmonkey

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            goos: darwin
            goarch: arm64
            binary: teamsmonkey
          - name: macOS amd64
            goos: darwin
            goarch: amd64
            binary: teamsmonkey
          - name: Windows amd64
            goos: windows
            goarch: amd64
            binary: teamsmonkey.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.binary }}" .

      - name: Package
        run: |
          archive="teamsmonkey-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          files=("${{ matrix.binary }}" bundled-userscripts README.md)
          if [ -f LICENSE ]; then
            files+=(LICENSE)
          fi
          zip -r "$archive" "${files[@]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamsmonkey-${{ matrix.goos }}-${{ matrix.goarch }}
          path: teamsmonkey-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: teamsmonkey-*
          merge-multiple: true
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes
